[workspace]
resolver = "2"
members = [
    "crates/wvq-domain",
    "crates/wvq-spec",
    "crates/wvq-intelligence",
    "crates/wvq-runtime",
]
default-members = [
    "crates/wvq-domain",
    "crates/wvq-spec",
    "crates/wvq-intelligence",
    "crates/wvq-runtime",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
license = "MIT"
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix-quality"
readme = "README.md"
publish = false

[workspace.dependencies]
wvq-domain = { path = "crates/wvq-domain", version = "0.0.1" }
wvq-spec = { path = "crates/wvq-spec", version = "0.0.1" }
wvq-intelligence = { path = "crates/wvq-intelligence", version = "0.0.1" }
wvq-runtime = { path = "crates/wvq-runtime", version = "0.0.1" }

blazingly-json = "0.1"
weavatrix-rust = { version = "2.6.0", default-features = false }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
quick-xml = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
