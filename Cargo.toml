[workspace]
resolver = "2"
members = [
    "crates/wvq-domain",
    "crates/wvq-spec",
    "crates/wvq-spec-recovery",
    "crates/wvq-intelligence",
    "crates/wvq-runtime",
    "crates/wvq-store",
    "crates/wvq-ui",
    "crates/wvq-proof",
    "crates/wvq-command-bus",
    "crates/wvq-bench",
    "apps/wvq-cli",
    "apps/wvq-mcp",
    "apps/qualityd",
]
default-members = [
    "crates/wvq-domain",
    "crates/wvq-spec",
    "crates/wvq-spec-recovery",
    "crates/wvq-intelligence",
    "crates/wvq-runtime",
    "crates/wvq-store",
    "crates/wvq-ui",
    "crates/wvq-proof",
    "crates/wvq-command-bus",
    "crates/wvq-bench",
    "apps/wvq-cli",
    "apps/wvq-mcp",
    "apps/qualityd",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
license = "MIT"
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix-quality"
readme = "README.md"
publish = false

[workspace.dependencies]
wvq-domain = { path = "crates/wvq-domain", version = "0.0.1" }
wvq-spec = { path = "crates/wvq-spec", version = "0.0.1" }
wvq-spec-recovery = { path = "crates/wvq-spec-recovery", version = "0.0.1" }
wvq-intelligence = { path = "crates/wvq-intelligence", version = "0.0.1" }
wvq-runtime = { path = "crates/wvq-runtime", version = "0.0.1" }
wvq-store = { path = "crates/wvq-store", version = "0.0.1" }
wvq-ui = { path = "crates/wvq-ui", version = "0.0.1" }
wvq-proof = { path = "crates/wvq-proof", version = "0.0.1" }
wvq-command-bus = { path = "crates/wvq-command-bus", version = "0.0.1" }
wvq-bench = { path = "crates/wvq-bench", version = "0.0.1" }
qualityd = { path = "apps/qualityd", version = "0.0.1" }

blazingly-json = "0.1"
mcport = "0.5.0"
weavatrix-rust = { version = "2.6.0", default-features = false, features = ["clone", "git", "lang-rust"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
# Full debuginfo makes `target/` several gigabytes on this workspace. Line
# tables keep backtraces readable at a fraction of the size.
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
