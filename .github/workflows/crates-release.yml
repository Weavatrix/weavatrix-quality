name: Publish crates.io packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version already on the branch (must match Cargo/npm)"
        required: true
        default: "0.1.0-alpha.2"

concurrency:
  group: crates-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Weavatrix/weavatrix-quality'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Verify tag matches Cargo/npm versions
        run: |
          VERSION="$(node -p "require('./npm/wvq/package.json').version")"
          CARGO_VERSION="$(cargo metadata --locked --format-version 1 | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).packages.find(p=>p.name==='wvq-cli').version))")"
          test "${CARGO_VERSION}" = "${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${VERSION}" = "${{ inputs.version }}"
          else
            test "v${VERSION}" = "${GITHUB_REF_NAME}"
          fi
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish"
            exit 0
          fi
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            EXPECTED="${{ inputs.version }}"
          fi
          publish() {
            local crate="$1"
            # Prefer crates.io HTTP over `cargo info`: workspace path members
            # make `cargo info crate@version` succeed even when unpublished.
            if curl --fail --silent --show-error \
              -A "weavatrix-quality-ci (github.com/Weavatrix/weavatrix-quality)" \
              "https://crates.io/api/v1/crates/${crate}/${EXPECTED}" >/dev/null; then
              echo "${crate}@${EXPECTED} already on crates.io; skipping"
              return 0
            fi
            local attempt=1
            while true; do
              set +e
              out="$(cargo publish -p "$crate" --locked --no-verify 2>&1)"
              code=$?
              set -e
              echo "$out"
              if [ "$code" -eq 0 ]; then
                return 0
              fi
              if echo "$out" | grep -qi 'already exists'; then
                echo "${crate}@${EXPECTED} already exists; skipping"
                return 0
              fi
              if echo "$out" | grep -qi 'Too Many Requests'; then
                echo "rate limited publishing ${crate}; sleeping 180s (attempt ${attempt})"
                sleep 180
                attempt=$((attempt + 1))
                if [ "$attempt" -gt 8 ]; then
                  return "$code"
                fi
                continue
              fi
              return "$code"
            done
          }
          # Leaf â†’ binaries. --no-verify avoids needing every transitive build
          # tool on the publisher; CI already built the workspace.
          publish wvq-domain
          publish wvq-spec
          publish wvq-store
          publish wvq-spec-recovery
          publish wvq-ui
          publish wvq-runtime
          publish wvq-intelligence
          publish wvq-proof
          publish wvq-command-bus
          publish wvq-bench
          publish wvq-mcp
          publish qualityd
          publish wvq-cli
