# name: wvq-dogfood
on:
  pull_request:
  push:
    branches: [main]

jobs:
  wvq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Doctor
        run: npx @weavatrix/wvq@0.1.0-alpha.1 doctor
      - name: Spec validate
        run: npx @weavatrix/wvq@0.1.0-alpha.1 spec validate --change current
      - name: Impacted run
        run: >
          npx @weavatrix/wvq@0.1.0-alpha.1 run
          --change current
          --base origin/${{ github.base_ref || 'main' }}
          --head HEAD
          --scope impacted
          --evidence-policy minimal
      - name: Observe-only verify
        run: >
          npx @weavatrix/wvq@0.1.0-alpha.1 verify
          --change current
          --observe-only true
